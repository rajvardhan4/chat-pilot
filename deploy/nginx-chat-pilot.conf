# Chat Pilot Cloud - nginx reverse proxy.
#
# Install:
#   sudo cp deploy/nginx-chat-pilot.conf /etc/nginx/sites-available/chat-pilot
#   sudo ln -s /etc/nginx/sites-available/chat-pilot /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then let certbot fill in the TLS lines:
#   sudo certbot --nginx -d app.YOURDOMAIN.com
#
# Replace app.YOURDOMAIN.com throughout before installing.

server {
    listen 80;
    listen [::]:80;
    server_name app.YOURDOMAIN.com;

    # certbot rewrites this block to redirect to HTTPS once a certificate
    # exists. Until then it has to serve the ACME challenge over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.YOURDOMAIN.com;

    # certbot fills these in. Do not hand-edit them afterwards.
    # ssl_certificate     /etc/letsencrypt/live/app.YOURDOMAIN.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.YOURDOMAIN.com/privkey.pem;

    # Knowledge-base uploads. The app enforces its own limit (UPLOAD_MAX_BYTES,
    # 10 MB by default) and answers 413 politely; nginx has to allow at least
    # that much through first, or it rejects the upload with a bare HTML error
    # page the portal cannot explain.
    client_max_body_size 12m;

    # Chat answers stream from an AI provider, which can take a while on a long
    # reply. The app's own provider timeout is 20s; give nginx headroom above it
    # so a slow-but-successful answer is not cut off at the proxy.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    access_log /var/log/nginx/chat-pilot.access.log;
    error_log  /var/log/nginx/chat-pilot.error.log;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # TRUST_PROXY=true in .env makes the app read these. Without both sides
        # agreeing, the app sees plain http behind TLS and redirect-loops.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
    }

    # Static assets are fingerprint-free, so the app sets its own 7-day cache
    # header in production and nginx just passes it through.
    location /assets/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
    }
}
